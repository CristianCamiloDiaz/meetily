<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Meeting detected</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            cursor: default;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 10px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(28, 28, 30, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            color: #fff;
        }
        .icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f8df7, #7b5cf0);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .text { flex: 1; min-width: 0; }
        .title { font-size: 13px; font-weight: 600; }
        .body { font-size: 12px; color: rgba(255, 255, 255, 0.65); margin-top: 2px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        button {
            font-family: inherit;
            font-size: 12px; font-weight: 600;
            border: none; border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
        }
        .record { background: #e5484d; color: #fff; }
        .record:hover { background: #f2555a; }
        .dismiss { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.75); }
        .dismiss:hover { background: rgba(255, 255, 255, 0.18); }
        .progress {
            position: absolute; left: 26px; right: 26px; bottom: 10px;
            height: 2px; border-radius: 1px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        .progress > div {
            height: 100%; width: 100%;
            background: rgba(255, 255, 255, 0.35);
            transform-origin: left;
            animation: drain linear forwards;
        }
        @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎙️</div>
        <div class="text">
            <div class="title" id="title">Meeting detected</div>
            <div class="body" id="body">Start recording?</div>
        </div>
        <div class="actions">
            <button class="record" id="start">Start recording</button>
            <button class="dismiss" id="dismiss">Dismiss</button>
        </div>
        <div class="progress"><div id="bar"></div></div>
    </div>
    <script src="meeting-alert.js"></script>
</body>
</html>
